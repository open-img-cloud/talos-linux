name: Infomaniak smoke (unpublished)

# Runs the shared OpenStack smoke (talos contract) on Infomaniak with the
# image built by a release.yml run (publish=false): the qcow2 is uploaded to
# Glance from the build artifact, nothing is published.
# Needs the OS_* secrets on this repository (organisation secrets do not
# reach private repositories on the Free plan).
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'release.yml run whose image to test'
        required: true
      shared_ref:
        description: 'Ref of open-img-cloud/.github for the smoke action'
        required: false
        default: 'main'

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Fetch the image
        id: img
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name=$(gh api "repos/${{ github.repository }}/actions/runs/${{ inputs.run_id }}/artifacts" \
            -q '[.artifacts[] | select(.name | startswith("freebsd-image-") | not) | select(.name | startswith("talos-linux"))][0].name')
          gh run download "${{ inputs.run_id }}" -R "${{ github.repository }}" -n "$name" -D "$RUNNER_TEMP/art"
          f=$(ls "$RUNNER_TEMP"/art/*.qcow2 | head -1)
          ls -l "$f"
          echo "path=$f" >> "$GITHUB_OUTPUT"
          echo "file=$(basename "$f")" >> "$GITHUB_OUTPUT"
      - name: Shared actions
        uses: actions/checkout@v5
        with:
          repository: open-img-cloud/.github
          ref: ${{ inputs.shared_ref }}
          path: .oic-shared
      - name: Version
        id: v
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Install cosign (verifies talosctl)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Runtime smoke on Infomaniak
        uses: ./.oic-shared/actions/smoke-openstack
        with:
          os_name:                          talos-linux
          version:                          ${{ steps.v.outputs.version }}
          filename:                         ${{ steps.img.outputs.file }}
          image_path:                       ${{ steps.img.outputs.path }}
          login_user:                       talos
          contract:                         talos
          os_auth_url:                      ${{ secrets.OS_AUTH_URL }}
          os_region_name:                   ${{ secrets.OS_REGION_NAME }}
          os_application_credential_id:     ${{ secrets.OS_APPLICATION_CREDENTIAL_ID }}
          os_application_credential_secret: ${{ secrets.OS_APPLICATION_CREDENTIAL_SECRET }}
