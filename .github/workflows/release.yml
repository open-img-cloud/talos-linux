name: Build & publish image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Override the Talos version (e.g. 1.14.6); otherwise derived from the tag, falling back to VERSION'
        required: false
      publish:
        description: 'If false, skip upload + CF purge (dry-run validation)'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write   # cosign keyless via GitHub OIDC

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - id: v
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.version }}" ]]; then
            v="${{ inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
          else
            v=$(tr -d '[:space:]' < VERSION)
          fi
          if [[ ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version '$v' is not a stable Talos release (e.g. 1.14.6)"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  # Built with Sidero Labs' signed imager on a GitHub-hosted Linux runner
  # (build/build.sh), then signed, published and smoke-tested by the shared
  # pipeline. Talos has no SSH: the smoke uses the talos contract.
  build:
    needs: resolve-version
    name: Talos Linux
    uses: open-img-cloud/.github/.github/workflows/build-freebsd-image.yml@flatcar-support
    with:
      os_name: talos-linux
      version: ${{ needs.resolve-version.outputs.version }}
      output_filename: 'talos-{version}-x86_64.qcow2'
      build_script: build/build.sh
      build_runner: '["ubuntu-latest"]'
      runtime_smoke_login_user: talos
      runtime_smoke_contract: talos
      publish: ${{ inputs.publish == true || github.event_name == 'push' }}
      sync_latest: true
      shared_actions_ref: flatcar-support
    secrets: inherit
